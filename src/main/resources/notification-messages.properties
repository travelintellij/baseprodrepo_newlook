QUERY_REMINDER_MESSAGE=Dear %(CONTACT_NAME), This is to remind you that we are eagerly waiting to hear for your upcoming travel plan. Please share an update as we are eager to serve you. Thx %(COMPANY_NAME) %(USER_NAME) %(USER_MOBILE)

PACKAGE_CONFIRMATION=Dear %(CONTACT_NAME), We are pleased to confirm your package (PKG REF # <PKG-NO> ) based on our discussion. We are working on it and soon will revert on the same. Thx %(COMPANY_NAME) %(USER_NAME) %(USER_MOBILE)

QUERY_REGISTRATION_MSG=Dear %(CONTACT_NAME), We have registered your query in our system with Query ID <QueryId> and we are actively working on it. We will revert soon on the same. Thx %(COMPANY_NAME) %(USER_NAME) %(USER_MOBILE)

QUERY_FEEDBACK_MSG=Dear %(CONTACT_NAME) Thanks for considering UdanChoo.com. I hope you liked your stay with us and we would appreciate if you can share your best possible rating with us. It will help us to serve you better. Thx %(USER_NAME) %(USER_MOBILE)

QUERY_TICKET_CREATE_MSG=Dear %(CONTACT_NAME) We have successfully created your service request in our system and your TicketId is UDN-TKT-<ticket-Id>. We are working on it and will revert soon with the best resolution. Thx %(COMPANY_NAME) %(USER_NAME) %(USER_MOBILE)

QUERY_QTN_SENT_MSG=Dear %(CONTACT_NAME) We have sent the detailed quotation on your registered email id with us against your Query ID - <QueryId>. Please confirm us back. Thx %(COMPANY_NAME) %(USER_NAME) %(USER_MOBILE)
